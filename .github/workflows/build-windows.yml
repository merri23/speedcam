name: Build Esasy.exe (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # tag bilen Release döretmek üçin

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install torch (CPU, Windows)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project deps + PyInstaller + pywebview
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Download YOLO model (bundled into the exe)
        run: curl -L -o yolov8n.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt

      - name: Quick pipeline self-test (motion detector, synthetic video)
        run: |
          python samples/make_synthetic.py --out samples/synthetic.mp4
          python cli.py --source samples/synthetic.mp4 --distances 10 --detector motion

      - name: YOLO self-test (real vehicle photo video)
        run: |
          python samples/make_synthetic.py --sprite samples/real_vehicle.jpg --out samples/realistic.mp4
          python cli.py --source samples/realistic.mp4 --distances 10 --detector yolo

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean Esasy.spec

      - name: Self-test the built exe (libraries + YOLO model inside the bundle)
        run: dist/Esasy/Esasy.exe --selftest

      - name: Full pipeline inside the built exe (YOLO on realistic.mp4)
        run: dist/Esasy/Esasy.exe --cli --source samples/realistic.mp4 --distances 10 --detector yolo

      - name: Smoke-test the built exe (server starts, health endpoint answers)
        shell: pwsh
        run: |
          $env:SPEEDCAM_PORT = "8765"
          $p = Start-Process -FilePath "dist/Esasy/Esasy.exe" -ArgumentList "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($p.HasExited) { break }
          }
          Get-Process -Name Esasy -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Write-Host "---- server.log ----"
            Get-Content "$env:LOCALAPPDATA/SpeedCam/server.log" -ErrorAction SilentlyContinue
            throw "Esasy.exe server did not start"
          }
          Write-Host "Esasy.exe OK"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Esasy/* -DestinationPath Esasy-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Esasy-windows
          path: Esasy-windows.zip
          retention-days: 14

      - name: Release (only on tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Esasy-windows.zip
